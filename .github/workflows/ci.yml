name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Governance: validates branch name, commit messages, and PR title using
  # the workflow-framework's own Work ID utilities (dogfooding).
  # ---------------------------------------------------------------------------
  governance:
    name: Governance check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git log)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: packages/workflow-framework

      - name: Build framework
        run: pnpm build
        working-directory: packages/workflow-framework

      - name: Governance check (branch + commits + PR title)
        run: node scripts/check-governance.mjs
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}

  # ---------------------------------------------------------------------------
  # Test: type-checks and runs the full test suite.
  # ---------------------------------------------------------------------------
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: packages/workflow-framework

      - name: Typecheck
        run: pnpm typecheck
        working-directory: packages/workflow-framework

      - name: Test
        run: pnpm test
        working-directory: packages/workflow-framework
