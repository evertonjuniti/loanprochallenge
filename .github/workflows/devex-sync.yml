# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# This file was generated by @loanpro/devex-workflow-framework.
# Do not edit manually — regenerate with:
#   node scripts/generate-workflows.mjs

name: Sync DevEx Workflows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of @loanpro/devex-workflow-framework to update to (e.g. "0.3.0" or "latest")
        required: false
        default: latest
      ticket_id:
        description: Work ticket ID for governance compliance (e.g. DEVEX-42). Required to pass PR checks.
        required: true
jobs:
  sync:
    name: Sync DevEx Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install current dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Update @loanpro/devex-workflow-framework
        env:
          VERSION: ${{ inputs.version }}
        run: |-
          if [ "$VERSION" = "latest" ]; then
            pnpm add @loanpro/devex-workflow-framework@latest --save-dev
          else
            pnpm add "@loanpro/devex-workflow-framework@$VERSION" --save-dev
          fi
      - name: Regenerate workflow files
        run: pnpm exec devex-workflow generate
      - name: Open PR with updated workflows
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/${{ inputs.ticket_id }}-sync-devex-workflows
          title: "[${{ inputs.ticket_id }}] chore: sync DevEx workflow definitions"
          body: |-
            Automated sync of generated workflow files from `@loanpro/devex-workflow-framework`.

            | | |
            |---|---|
            | **Framework version** | `${{ inputs.version }}` |
            | **Triggered by** | @${{ github.actor }} |
            | **Custom config** | `devex.yaml` is unchanged — all service customisation is preserved |

            **Files regenerated:** `ci.yml`, `pr.yml`, `main.yml`, `devex-sync.yml`
          commit-message: "[${{ inputs.ticket_id }}] chore: sync DevEx workflow definitions"
          labels: automated,devex
