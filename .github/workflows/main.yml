    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run unit tests
        run: pnpm vitest run
      - name: Run property-based tests
        run: echo 'No property tests in this package'
      - name: Run contract tests
        run: echo 'No contract tests in this package'
      - name: Lint (eslint)
        run: pnpm run lint
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - name: Install dependencies
        working-directory: packages/cli
        run: |-
          if [ ! -f pyproject.toml ]; then
            echo "::warning::No pyproject.toml found — skipping Python step (project not yet initialised)."
            exit 0
          fi
          uv sync --frozen
      - name: Run unit tests
        working-directory: packages/cli
        run: |-
          if [ ! -f pyproject.toml ]; then
            echo "::warning::No pyproject.toml found — skipping Python step (project not yet initialised)."
            exit 0
          fi
          uv run pytest
      - name: Run property-based tests
        working-directory: packages/cli
        run: |-
          if [ ! -f pyproject.toml ]; then
            echo "::warning::No pyproject.toml found — skipping Python step (project not yet initialised)."
            exit 0
          fi
          echo 'No property tests in this package'
      - name: Run contract tests
        working-directory: packages/cli
        run: |-
          if [ ! -f pyproject.toml ]; then
            echo "::warning::No pyproject.toml found — skipping Python step (project not yet initialised)."
            exit 0
          fi
          echo 'No contract tests in this package'
      - name: Lint (ruff)
        working-directory: packages/cli
        run: |-
          if [ ! -f pyproject.toml ]; then
            echo "::warning::No pyproject.toml found — skipping Python step (project not yet initialised)."
            exit 0
          fi
          uv run ruff check .
    needs:
      - governance
  cdk-synth:
    name: CDK Synth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: check-infra-dir
        name: Check infra directory exists
        run: |-
          if [ ! -d "infra" ]; then
            echo "::warning::CDK working directory 'infra' not found — skipping CDK synth (infrastructure not yet initialised)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
        if: steps.check-infra-dir.outputs.skip != 'true'
      - name: Enable corepack (pnpm)
        run: corepack enable
        if: steps.check-infra-dir.outputs.skip != 'true'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: infra
        if: steps.check-infra-dir.outputs.skip != 'true'
      - name: CDK synth
        run: pnpm cdk synth
        working-directory: infra
        if: steps.check-infra-dir.outputs.skip != 'true'
    needs:
      - small-tests
  deploy-sandbox:
    name: Deploy (sandbox)
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: check-infra-dir
        name: Check infra directory exists
        run: |-
          if [ ! -d "infra" ]; then
            echo "::warning::CDK working directory 'infra' not found — skipping deployment (infrastructure not yet initialised)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
        if: steps.check-infra-dir.outputs.skip != 'true'
      - name: Enable corepack (pnpm)
        run: corepack enable
        if: steps.check-infra-dir.outputs.skip != 'true'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: infra
        if: steps.check-infra-dir.outputs.skip != 'true'
      - name: Configure AWS credentials (OIDC)
        if: steps.check-infra-dir.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_SANDBOX }}
          aws-region: us-east-1
      - id: cdk-deploy
        name: Deploy to sandbox
        if: steps.check-infra-dir.outputs.skip != 'true'
        run: pnpm cdk deploy --require-approval never TransactionifySandbox
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: us-east-1
      - name: Emit deployment audit event
        if: always()
        env:
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          ENVIRONMENT: sandbox
          CDK_STACK: TransactionifySandbox
          AWS_REGION: us-east-1
          DEPLOY_OUTCOME: ${{ steps.cdk-deploy.outcome }}
          PR_URL: ${{ github.event.pull_request.html_url || '' }}
        run: |-
          node --input-type=module << 'DEVEX_EMIT_AUDIT_SANDBOX'
          import { appendFileSync, existsSync, mkdirSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          const outcome = process.env.DEPLOY_OUTCOME ?? "unknown";
          const eventType = outcome === "success" ? "deployment_succeeded" : "deployment_failed";
          const event = {
            schemaVersion: "1.0",
            timestamp: new Date().toISOString(),
            eventType,
            actor: process.env.ACTOR ?? "",
            repository: process.env.REPOSITORY ?? "",
            workflowRunId: process.env.WORKFLOW_RUN_ID ?? "",
            sha: process.env.SHA ?? "",
            workId: null,
            environment: process.env.ENVIRONMENT ?? "sandbox",
            cdkStack: process.env.CDK_STACK ?? "",
            awsRegion: process.env.AWS_REGION ?? "us-east-1",
            stage: "deploy-sandbox",
            result: outcome === "success" ? "success" : "failure",
            why: process.env.PR_URL ?? "",
          };
          const outputPath = resolve("dora-events.ndjson");
          const dir = dirname(outputPath);
          if (!existsSync(dir)) { mkdirSync(dir, { recursive: true }); }
          appendFileSync(outputPath, JSON.stringify(event) + "\n", "utf-8");
          console.log("✓ Audit event emitted:", eventType);
          DEVEX_EMIT_AUDIT_SANDBOX
      - name: Upload audit events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-events-sandbox
          path: dora-events.ndjson
          if-no-files-found: ignore
    needs:
      - cdk-synth
