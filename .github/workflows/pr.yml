# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# This file was generated by @loanpro/devex-workflow-framework.
# Do not edit manually — regenerate with:
#   node scripts/generate-workflows.mjs

name: PR Pipeline
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write
jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - id: validate-branch
        name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          WORK_ID_PATTERN: ^[A-Z]+-[0-9]+$
          BRANCH_PATTERN: ^(feature|fix|chore|hotfix)/[A-Z]+-[0-9]+-[a-z0-9-]+$
        run: |-
          cat << 'DEVEX_BRANCH_CHECK' > /tmp/_devex_branch_check.mjs
          import { validateBranchName, DEFAULT_WORK_ID_CONFIG } from "@loanpro/devex-workflow-framework";
          const cfg = {
            ...DEFAULT_WORK_ID_CONFIG,
            workIdPattern: process.env.WORK_ID_PATTERN ?? DEFAULT_WORK_ID_CONFIG.workIdPattern,
            branchPattern: process.env.BRANCH_PATTERN ?? DEFAULT_WORK_ID_CONFIG.branchPattern,
          };
          const result = validateBranchName(process.env.BRANCH_NAME ?? "", cfg);
          if (!result.valid) {
            process.stderr.write("::error::" + result.message + "\n");
            process.exit(1);
          }
          console.log("✓ Branch Work ID:", result.workId);
          DEVEX_BRANCH_CHECK
          node /tmp/_devex_branch_check.mjs
      - id: validate-pr-title
        name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_TITLE_PATTERN: ^\[[A-Z]+-[0-9]+\] .+
        run: |-
          cat << 'DEVEX_PR_TITLE_CHECK' > /tmp/_devex_pr_title_check.mjs
          import { validatePrTitle, DEFAULT_WORK_ID_CONFIG } from "@loanpro/devex-workflow-framework";
          const title = process.env.PR_TITLE ?? "";
          if (!title) { console.log("⚠ No PR title (push event) — skipping."); process.exit(0); }
          const cfg = {
            ...DEFAULT_WORK_ID_CONFIG,
            prTitlePattern: process.env.PR_TITLE_PATTERN ?? DEFAULT_WORK_ID_CONFIG.prTitlePattern,
          };
          const result = validatePrTitle(title, cfg);
          if (!result.valid) {
            process.stderr.write("::error::" + result.message + "\n");
            process.exit(1);
          }
          console.log("✓ PR title Work ID:", result.workId);
          DEVEX_PR_TITLE_CHECK
          node /tmp/_devex_pr_title_check.mjs
      - id: validate-commits
        name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          COMMIT_PATTERN: ^\[[A-Z]+-[0-9]+\] .+
        run: |-
          cat << 'DEVEX_COMMIT_CHECK' > /tmp/_devex_commit_check.mjs
          import { execSync } from "node:child_process";
          import { validateCommitMessages, DEFAULT_WORK_ID_CONFIG } from "@loanpro/devex-workflow-framework";
          const base = process.env.BASE_SHA ?? "";
          const head = process.env.HEAD_SHA ?? "";
          const range = base && head ? base + ".." + head : "HEAD~1..HEAD";
          let raw = "";
          try { raw = execSync("git log --pretty=%s " + range, { encoding: "utf-8" }); }
          catch { console.log("⚠ Could not read git range " + range + " — skipping."); process.exit(0); }
          const messages = raw.split("\n").map(m => m.trim()).filter(Boolean);
          if (messages.length === 0) { console.log("⚠ No commits in range — skipping."); process.exit(0); }
          const cfg = {
            ...DEFAULT_WORK_ID_CONFIG,
            commitPattern: process.env.COMMIT_PATTERN ?? DEFAULT_WORK_ID_CONFIG.commitPattern,
          };
          const summary = validateCommitMessages(messages, cfg);
          if (summary.violations.length > 0) {
            process.stderr.write("::error::Commits missing Work ID:\n");
            summary.violations.forEach(v => process.stderr.write("  • " + v + "\n"));
            process.exit(1);
          }
          console.log("✓ All " + messages.length + " commit(s) contain a Work ID.");
          DEVEX_COMMIT_CHECK
          node /tmp/_devex_commit_check.mjs
      - id: validate-workflow-ref
        name: Validate workflow framework ref
        env:
          WORKFLOW_REF: v0.1.0
        run: |-
          cat << 'DEVEX_REF_CHECK' > /tmp/_devex_ref_check.mjs
          import { validateWorkflowRef } from "@loanpro/devex-workflow-framework";
          const result = validateWorkflowRef(process.env.WORKFLOW_REF ?? "");
          if (!result.valid) {
            result.errors.forEach(e => process.stderr.write("::error::" + e.message + "\n"));
            process.exit(1);
          }
          console.log("✓ Workflow ref pinned to:", process.env.WORKFLOW_REF);
          DEVEX_REF_CHECK
          node /tmp/_devex_ref_check.mjs
  small-tests:
    name: Small Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run unit tests
        run: uv run pytest tests/unit
      - name: Run property-based tests
        run: uv run pytest tests/property
      - name: Run contract tests
        run: uv run pytest tests/contracts
      - name: Lint (ruff)
        run: uv run ruff check .
    needs:
      - governance
  cdk-synth:
    name: CDK Synth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: infra
      - name: CDK synth
        run: pnpm cdk synth
        working-directory: infra
    needs:
      - small-tests
  deploy-sandbox:
    name: Deploy (sandbox)
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: infra
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_SANDBOX }}
          aws-region: us-east-1
      - id: cdk-deploy
        name: Deploy to sandbox
        run: pnpm cdk deploy --require-approval never TransactionifySandbox
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: us-east-1
      - name: Emit deployment audit event
        if: always()
        env:
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          ENVIRONMENT: sandbox
          CDK_STACK: TransactionifySandbox
          AWS_REGION: us-east-1
          DEPLOY_OUTCOME: ${{ steps.cdk-deploy.outcome }}
          PR_URL: ${{ github.event.pull_request.html_url || '' }}
        run: |-
          cat << 'DEVEX_EMIT_AUDIT_SANDBOX' > /tmp/_devex_emit_audit_sandbox.mjs
          import { createDeploymentAuditEvent, appendEventsToFile } from "@loanpro/devex-workflow-framework";
          const outcome = process.env.DEPLOY_OUTCOME ?? "unknown";
          const eventType = outcome === "success" ? "deployment_succeeded" : "deployment_failed";
          const event = createDeploymentAuditEvent({
            eventType,
            actor: process.env.ACTOR ?? "",
            repository: process.env.REPOSITORY ?? "",
            workflowRunId: process.env.WORKFLOW_RUN_ID ?? "",
            sha: process.env.SHA ?? "",
            workId: null,
            environment: process.env.ENVIRONMENT ?? "sandbox",
            cdkStack: process.env.CDK_STACK ?? "",
            awsRegion: process.env.AWS_REGION ?? "us-east-1",
            stage: "deploy-sandbox",
            result: outcome === "success" ? "success" : "failure",
            why: process.env.PR_URL ?? "",
          });
          appendEventsToFile([event]);
          console.log("✓ Audit event emitted:", eventType);
          DEVEX_EMIT_AUDIT_SANDBOX
          node /tmp/_devex_emit_audit_sandbox.mjs
      - name: Upload audit events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-events-sandbox
          path: dora-events.ndjson
          if-no-files-found: ignore
    needs:
      - cdk-synth
  deploy-staging:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
