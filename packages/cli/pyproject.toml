[project]
name = "devex-cli"
version = "0.1.0"
description = "LoanPro DevEx Golden Path CLI — developer-facing tool for standardizing Git workflows, conventions, and CI/CD integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.15.0",
  "pydantic>=2.0.0",
  "rich>=13.0.0",
  "pyyaml>=6.0",
  "jinja2>=3.1.0",
]

[project.scripts]
devex = "devex_cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devex_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
