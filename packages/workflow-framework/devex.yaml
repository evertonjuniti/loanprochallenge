# yaml-language-server: $schema=./devex.schema.json
# devex.yaml — loanprochallenge monorepo configuration
# This file describes the monorepo itself to the devex CI tooling.
# It is used by scripts/generate-workflows.mjs to regenerate .github/workflows/.
# Validate locally with: devex check

schemaVersion: 1

service:
  name: devex-workflow-framework
  owner: platform-team
  type: platform-tool

workTracking:
  workIdPattern: "^[A-Z]+-[0-9]+$"
  branchPattern: "^(feature|fix|chore|hotfix)/[A-Z]+-[0-9]+-[a-z0-9-]+$"
  commitPattern: "^\\[[A-Z]+-[0-9]+\\] .+"
  prTitlePattern: "^\\[[A-Z]+-[0-9]+\\] .+"

runtime:
  appLanguage: [typescript, python]
  infraLanguage: typescript
  infraFramework: none

local:
  testCommand: "uv run pytest"
  lintCommand: "uv run ruff check ."

ci:
  smallTests:
    # Per-adapter overrides for this polyglot monorepo.
    typescript:
      unit: "pnpm --filter @loanpro/devex-workflow-framework test"
      property: "echo 'No property tests in this package'"
      contract: "echo 'No contract tests in this package'"
      lint: "pnpm --filter @loanpro/devex-workflow-framework lint"
    python:
      # The Python CLI package lives at packages/cli.
      workingDirectory: packages/cli
      unit: "uv run pytest"
      property: "echo 'No property tests in this package'"
      contract: "echo 'No contract tests in this package'"
      lint: "uv run ruff check ."

environments:
  sandbox:
    awsRegion: us-east-1
    cdkStack: DevexWorkflowFrameworkSandbox
    githubEnvironment: sandbox

telemetry:
  sink: github-artifact
  auditFormat: ndjson

workflowVersion:
  ref: v0.3.0
